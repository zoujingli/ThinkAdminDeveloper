name: Test Admin Plugin

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'plugin/**'
      - 'tests/**'
      - 'config/**'
      - 'database/**'
      - 'think'
      - 'composer.json'
      - '.env.example'
      - '.github/**'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.2'
            mysql: '8.4'
            scope: full
          - php: '8.2'
            mysql: '8.4'
            scope: full
          - php: '7.2'
            mysql: '5.7'
            scope: upgrade
          - php: '8.2'
            mysql: '8.0'
            scope: upgrade
    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Run reproducible Docker acceptance
        run: bash tests/docker/run.sh '${{ matrix.php }}' '${{ matrix.mysql }}' '${{ matrix.scope }}'

      - name: Keep acceptance evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.php }}-${{ matrix.mysql }}
          path: runtime/acceptance/
          if-no-files-found: error
          overwrite: true

      - name: Check diff whitespace
        run: git diff --check
